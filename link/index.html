  .small a{color:var(--cyan)}

  <h1>Paintup</h1>
  <p id="msg">Looking for the current address…</p>
  <form id="login" class="go" hidden>
    <input id="code" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Code" required>
    <button type="submit">Sign in</button>
    <p class="small">The code is saved on this device only. After the first time you go straight in.</p>
  </form>
  <p class="small" id="forgetp" hidden><a href="#" id="forget">Change code</a></p>
</main>
<script>
  // Paintup runs on a PC behind a tunnel whose address changes on restart. The PC publishes the
  // current address to tunnel.json; this page stays put. The code lives only in this browser.
  const $ = id => document.getElementById(id);
  const store = {
    get() { try { return localStorage.getItem('paintup_code') || ''; } catch (e) { return ''; } },
    set(v) { try { localStorage.setItem('paintup_code', v); } catch (e) {} },
    del() { try { localStorage.removeItem('paintup_code'); } catch (e) {} }
  };
  let base = '';
  function go() {
    const code = store.get();
    $('login').hidden = !!code;
    $('forgetp').hidden = !code;
    if (!code) { $('msg').textContent = 'Enter your code once.'; return; }
    $('msg').textContent = 'Opening Paintup…';
    location.replace(base + '/?key=' + encodeURIComponent(code));
  }
  $('login').onsubmit = e => { e.preventDefault(); store.set($('code').value.trim()); go(); };
  $('forget').onclick = e => { e.preventDefault(); store.del(); $('code').value = ''; $('login').hidden = false; $('forgetp').hidden = true; $('msg').textContent = 'Enter your code.'; };
  // One-time setup link: .../paintup/#k=<code> stores the code on this device, then drops it from the address bar.
  const m = location.hash.match(/^#k=([A-Za-z0-9]+)$/);
  if (m) { store.set(m[1]); history.replaceState(null, '', location.pathname); }
  fetch('../tunnel.json?t=' + Date.now(), {cache:'no-store'})
    .then(r => r.json())
    .then(d => { base = (d.url || '').replace(/\/+$/, ''); if (!base) throw 0; go(); })
    .catch(() => { $('msg').textContent = 'Paintup is not reachable right now. Please try again in a minute.'; });
</script>
</body></html>
